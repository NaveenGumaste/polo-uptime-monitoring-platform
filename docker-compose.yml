services:
  polo-web:
    build:
      context: ./web
    image: polo-web:local
    environment:
      DATABASE_URL: "${DATABASE_URL:?Set DATABASE_URL in web/.env}"
    ports:
      - "127.0.0.1:3001:3000"
    networks:
      - polo-net
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/monitors').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

  polo-probe:
    build:
      context: ./probe
    image: polo-probe:local
    environment:
      WEB_API_URL: http://polo-web:3000
      LISTEN_ADDR: ":8080"
    ports:
      - "127.0.0.1:8082:8080"
    networks:
      - polo-net
    restart: unless-stopped
    depends_on:
      polo-web:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - wget
        - -q
        - -O
        - /dev/null
        - http://127.0.0.1:8080/health
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3

  alertmanager:
    image: prom/alertmanager:v0.35.0
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    volumes:
      - ./monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    secrets:
      - discord_webhook_url
    ports:
      - "127.0.0.1:9093:9093"
    networks:
      - polo-net
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "-q",
          "-O",
          "/dev/null",
          "http://127.0.0.1:9093/-/ready",
        ]
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 3

  prometheus:
    image: prom/prometheus:v3.16.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alert.rules.yml:/etc/prometheus/alert.rules.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    networks:
      - polo-net
    restart: unless-stopped
    depends_on:
      polo-probe:
        condition: service_healthy
      alertmanager:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "-q",
          "-O",
          "/dev/null",
          "http://127.0.0.1:9090/-/ready",
        ]
      interval: 15s
      timeout: 5s
      start_period: 15s
      retries: 3

  grafana:
    image: grafana/grafana:13.3.1
    environment:
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:3002:3000"
    networks:
      - polo-net
    restart: unless-stopped
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "-q",
          "-O",
          "/dev/null",
          "http://127.0.0.1:3000/api/health",
        ]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 3

networks:
  polo-net:
    driver: bridge

volumes:
  prometheus-data:
  alertmanager-data:
  grafana-data:

secrets:
  discord_webhook_url:
    file: ./monitoring/.env.discord-webhook
