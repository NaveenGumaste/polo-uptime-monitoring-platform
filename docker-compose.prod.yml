name: polo

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  polo-web:
    image: ${WEB_IMAGE:?Set WEB_IMAGE to the verified GHCR image}
    env_file:
      - path: ./secrets/web.env
        format: raw
    ports:
      - "127.0.0.1:3001:3000"
    networks: [polo-net]
    restart: unless-stopped
    logging: *logging
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/api/monitors').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 5

  polo-probe:
    image: ${PROBE_IMAGE:?Set PROBE_IMAGE to the verified GHCR image}
    environment:
      WEB_API_URL: http://polo-web:3000
      LISTEN_ADDR: ":8080"
    ports:
      - "127.0.0.1:8082:8080"
    networks: [polo-net]
    restart: unless-stopped
    logging: *logging
    depends_on:
      polo-web:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, "http://127.0.0.1:8080/health"]
      interval: 15s
      timeout: 3s
      start_period: 5s
      retries: 5

  alertmanager:
    image: prom/alertmanager:v0.35.0
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    volumes:
      - ./monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    secrets: [discord_webhook_url]
    ports:
      - "127.0.0.1:9093:9093"
    networks: [polo-net]
    restart: unless-stopped
    logging: *logging
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, "http://127.0.0.1:9093/-/ready"]
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 5

  prometheus:
    image: prom/prometheus:v3.16.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --storage.tsdb.retention.size=2GB
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alert.rules.yml:/etc/prometheus/alert.rules.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    networks: [polo-net]
    restart: unless-stopped
    logging: *logging
    depends_on:
      polo-probe:
        condition: service_healthy
      alertmanager:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, "http://127.0.0.1:9090/-/ready"]
      interval: 15s
      timeout: 5s
      start_period: 15s
      retries: 5

  grafana:
    image: grafana/grafana:13.3.1
    environment:
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
    secrets: [grafana_admin_password]
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "127.0.0.1:3002:3000"
    networks: [polo-net]
    restart: unless-stopped
    logging: *logging
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, "http://127.0.0.1:3000/api/health"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 5

networks:
  polo-net:
    driver: bridge

volumes:
  prometheus-data:
  alertmanager-data:
  grafana-data:

secrets:
  discord_webhook_url:
    file: ./secrets/discord-webhook
  grafana_admin_password:
    file: ./secrets/grafana-admin-password
